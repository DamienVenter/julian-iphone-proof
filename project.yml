# A pretend iPhone app with faults planted in it, for the iPhone testers' proof (core/ios.js, deploy/CHUNK-testers.md
# phase 4). XcodeGen makes its Xcode project on GitHub's Mac (core/ios-build.sh).
name: Planted
options:
  bundleIdPrefix: com.julian
  deploymentTarget:
    iOS: "16.0"
targets:
  Planted:
    type: application
    platform: iOS
    sources: [Planted]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julian.planted
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planted
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
